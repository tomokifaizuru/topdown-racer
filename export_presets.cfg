[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*,docs/*,*.png,audio/music/*.wav,audio/music/*.mp3,audio/music/*.mp4,audio/music/*.mid,audio/music/*.py,audio/music/*.sh"
export_path="docs/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>body{background:#1a1c24;} #status{background:#1a1c24;}</style><script>/* Topdown Racer: seamless music loops on the web. Godot 4.5.1 web sample playback loops a sound by restarting it on its ended event, which leaves a short gap. Long buffers (the menu music, over 20 s) are looped natively by Web Audio instead (sample-accurate). */(function(){var p=AudioBufferSourceNode.prototype,s=p.start;p.start=function(){try{if(this.buffer&&this.buffer.duration>20&&!this.loop){this.loop=true;this.loopStart=0;this.loopEnd=0;}}catch(e){}return s.apply(this,arguments);};})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
